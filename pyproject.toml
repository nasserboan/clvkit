[project]
name = "clvkit"
version = "0.1.0"
description = "CLV engine and cohort-retention over a shared transaction-log contract."
readme = "README.md"
authors = [
    { name = "nsboan", email = "nasserboan@gmail.com" }
]
requires-python = ">=3.11"
# BSD-3-Clause, matching numpy, scipy and pandas. Permissive, so a company can
# embed this without a legal review, and the no-endorsement clause keeps the
# project's name out of anyone else's marketing.
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.3",
    "pandas>=3.0.3",
    "scipy>=1.16",
]

[project.optional-dependencies]
dask = [
    "dask[dataframe]>=2025.1.0",
    "distributed>=2025.1.0",
]

# These render as the sidebar links on the PyPI project page, which is where a
# reader who finds the package before the article lands first. Homepage points
# at the Pages site rather than the repo, so the article and the install line
# are one click from PyPI. The utm_source key makes a visitor arriving from the
# PyPI sidebar distinguishable in analytics (see docs/launch-measurement.md).
# No Changelog entry until there is a CHANGELOG.md to point at — a 404 in the
# sidebar is worse than a missing row.
[project.urls]
Homepage = "https://nasserboan.github.io/clvkit/?utm_source=pypi"
Source = "https://github.com/nasserboan/clvkit"
Issues = "https://github.com/nasserboan/clvkit/issues"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Tests live in tests/; scoping discovery keeps bare `uv run pytest` (what CI
# runs) from sweeping up scripts at the repo root that match `*_test.py`.
testpaths = ["tests"]

[tool.ruff.lint]
# E/F (pycodestyle + pyflakes) are on by default; add import-sorting, pyupgrade, bugbear.
extend-select = ["I", "UP", "B"]

[dependency-groups]
# Dev-only, all three of the notebook ones: `pip install clvkit` still gets the
# four runtime deps and nothing else. `ipykernel` is the kernel nbmake executes
# against, and `openpyxl` is the engine `pd.read_excel` needs for the Online
# Retail II workbook — pandas doesn't vendor one.
dev = [
    "ipykernel>=7.3.0",
    "nbmake>=1.5.5",
    "openpyxl>=3.1.5",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
docs = [
    "nbsphinx>=0.9.8",
    "pydata-sphinx-theme>=0.20.0",
    "sphinx>=9.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

# The runtime floor is 3.11 (validated: the suite passes on 3.11 at both the
# newest compatible set and the exact pinned minimums). Docs tooling is
# maintainer-only and sphinx>=9.1 needs 3.12, so the docs group keeps a
# higher floor rather than dragging the package's down.
[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }
