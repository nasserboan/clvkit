name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/brand/**"
      - "examples/*.ipynb"
      - "src/clvkit/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one mid-flight: a half-published site
# is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the repository that actually has Pages turned on. Anywhere else this
    # fails at configure-pages, which would be a red build for no reason.
    if: github.repository == 'nasserboan/clvkit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # nbsphinx converts the example notebooks through pandoc.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # -W turns a broken cross-reference or a malformed docstring into a failed
      # build rather than a quietly degraded page. autodoc imports clvkit, so uv
      # installs the project alongside the docs group.
      - name: Build the docs
        run: uv run --group docs sphinx-build -b html -W docs/site _site

      # The output carries _static/ directories. Without this, GitHub could run
      # Jekyll over the artifact and strip every underscore-prefixed folder,
      # taking the CSS and search index with it.
      - name: Disable Jekyll
        run: touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
