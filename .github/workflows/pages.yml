name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/articles/01-manifesto.md"
      - "docs/articles/figures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one mid-flight: a half-published site
# is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the repository that actually has Pages turned on. Anywhere else this
    # fails at configure-pages, which would be a red build for no reason.
    if: github.repository == 'nasserboan/clvkit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is assembled from an explicit allowlist rather than from the
      # repo tree, so a file cannot reach the public site by merely existing.
      # Adding a page means adding a line here, which is the point.
      - name: Assemble the site source
        run: |
          set -euo pipefail
          mkdir -p build/the-shrug/figures
          cp site/_config.yml site/index.md build/

          # The article has one source of truth, docs/articles/01-manifesto.md.
          # It is copied in with front matter prepended and its body left byte
          # for byte, so its relative image paths keep working both here and in
          # GitHub's own markdown view. The figures land alongside the rendered
          # page, under the same /the-shrug/ prefix those paths resolve against.
          printf -- '---\npermalink: /the-shrug/\ntitle: The shrug\n---\n\n' > build/the-shrug.md
          cat docs/articles/01-manifesto.md >> build/the-shrug.md

          cp docs/articles/figures/01-alive-vs-spend.png \
             docs/articles/figures/02-frequency-zero-mass.png \
             docs/articles/figures/shrug.jpeg \
             build/the-shrug/figures/

      # Jekyll will happily publish an empty page, so the failure worth catching
      # is a site that built fine and quietly lost its content.
      - name: Check the assembled source
        run: |
          set -euo pipefail
          grep -q 'uv add clvkit' build/index.md
          grep -q '^# The shrug' build/the-shrug.md
          grep -q '(figures/shrug.jpeg)' build/the-shrug.md
          test -f build/the-shrug/figures/shrug.jpeg
          # Only the two pages named above are ever published. Anything else
          # that appears here arrived by accident.
          test "$(find build -maxdepth 1 -name '*.md' | wc -l)" -eq 2

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: build
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
